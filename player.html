<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hydralisk Visual Player</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="A premium, simplified visual player and synthesiser client for live-coded Hydra sketches." />
    <meta property="og:title" content="Hydralisk Visual Player" />
    <meta property="og:description" content="Play, inspect, and map MIDI inputs to live Hydra sketches without a bulky editor." />
    <meta property="og:image" content="./hydralisk.png" />
    
    <link rel="shortcut icon" type="image/png" href="./hydralisk.png" />
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="./css/normalize.css" />
    <link rel="stylesheet" href="./css/fontawesome.css" />
    <link rel="stylesheet" href="./css/midi-mapping.css" />
    <link rel="stylesheet" href="./css/player.css" />

    <!-- Define SimpleEvent emitter before other modules load so they can hook into it -->
    <script>
      class SimpleEmitter {
        constructor() {
          this.events = {};
        }
        on(event, listener) {
          if (!this.events[event]) {
            this.events[event] = [];
          }
          this.events[event].push(listener);
        }
        emit(event, data) {
          if (this.events[event]) {
            this.events[event].forEach(listener => listener(data));
          }
        }
      }
      window.xemitter = new SimpleEmitter();
    </script>

    <!-- Library dependencies -->
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.111.0.min.js"></script>
    <script src="./three.module.js" defer></script>
    <script src="./p5.min.js" defer></script>
    <script src="./react.min.js" defer></script>
    <script src="./react-dom.min.js" defer></script>
    <!-- Grab ojack's hydra player engine -->
    <script src="https://unpkg.com/hydra-synth"></script>
    <!-- Local app plugins & modules -->
    <script src="./modules.dist.js" defer></script>
    
    <!-- Player application (React) -->
    <script src="./player.dist.js" defer></script>
  </head>
  <body>
    <!-- React player application (src/player, bundled into ./player.dist.js) -->
    <div id="player-root"></div>
  </body>
</html>
